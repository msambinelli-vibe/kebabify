name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kebabify dist/kebabify
          tar -C dist -czf kebabify-${{ github.ref_name }}-${{ matrix.target }}.tar.gz kebabify

      - name: Build DEB
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg-deb/DEBIAN pkg-deb/usr/bin
          cp target/${{ matrix.target }}/release/kebabify pkg-deb/usr/bin/kebabify
          cat > pkg-deb/DEBIAN/control <<CONTROL
          Package: kebabify
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: kebabify maintainers
          Description: CLI to rename files to kebab-case or snake_case
          CONTROL
          dpkg-deb --build pkg-deb kebabify_${GITHUB_REF_NAME}_amd64.deb

      - name: Build Arch package (.pkg.tar.zst)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p archpkg
          cp target/${{ matrix.target }}/release/kebabify archpkg/kebabify
          cat > archpkg/PKGBUILD <<'PKG'
          pkgname=kebabify
          pkgver=__VERSION__
          pkgrel=1
          pkgdesc='CLI to rename files to kebab-case or snake_case'
          arch=('x86_64')
          license=('MIT')
          source=('kebabify')
          sha256sums=('SKIP')

          package() {
            install -Dm755 kebabify "$pkgdir/usr/bin/kebabify"
          }
          PKG
          sed -i "s/__VERSION__/${VERSION}/" archpkg/PKGBUILD

          docker run --rm -v "$PWD/archpkg:/work" -w /work archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed base-devel
            useradd -m builder
            chown -R builder:builder /work
            su builder -c "cd /work && makepkg -f --noconfirm"
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            kebabify-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            kebabify_${{ github.ref_name }}_amd64.deb
            archpkg/*.pkg.tar.zst
            archpkg/PKGBUILD
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.deb
            release-artifacts/*.pkg.tar.zst
            release-artifacts/PKGBUILD
