name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kebabify dist/kebabify
          tar -C dist -czf kebabify-${{ github.ref_name }}-${{ matrix.target }}.tar.gz kebabify

      - name: Build DEB
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg-deb/DEBIAN pkg-deb/usr/bin
          cp target/${{ matrix.target }}/release/kebabify pkg-deb/usr/bin/kebabify
          cat > pkg-deb/DEBIAN/control <<CONTROL
          Package: kebabify
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: kebabify maintainers
          Description: CLI to rename files to kebab-case or snake_case
          CONTROL
          dpkg-deb --build pkg-deb kebabify_${VERSION}_amd64.deb

      - name: Build Arch package source bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p arch
          sed "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD > arch/PKGBUILD
          tar -C arch -czf kebabify-${VERSION}-archlinux.tar.gz PKGBUILD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            kebabify-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            kebabify_${{ github.ref_name }}_amd64.deb
            kebabify-*-archlinux.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.deb
